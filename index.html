<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="한 번에 다섯 게임의 로또 번호를 추천해 드립니다.">
  <meta name="theme-color" content="#111827">
  <title>오늘의 로또 번호</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #070b14;
      --panel: rgba(17, 24, 39, 0.82);
      --panel-line: rgba(255, 255, 255, 0.10);
      --text: #f8fafc;
      --muted: #a8b3c7;
      --accent: #a3ff5f;
      --accent-strong: #80e63b;
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.38);
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 12% 10%, rgba(163, 255, 95, 0.14), transparent 28rem),
        radial-gradient(circle at 88% 90%, rgba(59, 130, 246, 0.13), transparent 30rem),
        var(--bg);
      color: var(--text);
      font-family: Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
      line-height: 1.5;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.16;
      background-image: linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: linear-gradient(to bottom, black, transparent 85%);
    }

    main {
      position: relative;
      z-index: 1;
      display: grid;
      place-items: center;
      width: min(100% - 32px, 880px);
      min-height: 100vh;
      margin-inline: auto;
      padding-block: 48px;
    }

    .app { width: 100%; }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 12px;
      color: var(--accent);
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 18px var(--accent);
    }

    h1 {
      margin: 0;
      font-size: clamp(2.25rem, 8vw, 4.7rem);
      font-weight: 900;
      letter-spacing: -0.065em;
      line-height: 0.98;
    }

    .intro {
      max-width: 520px;
      margin: 18px 0 30px;
      color: var(--muted);
      font-size: clamp(1rem, 2.4vw, 1.12rem);
    }

    .panel {
      padding: clamp(18px, 4vw, 30px);
      border: 1px solid var(--panel-line);
      border-radius: 28px;
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 20px;
    }

    .panel-title {
      margin: 0;
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .count {
      padding: 5px 10px;
      border: 1px solid rgba(163, 255, 95, 0.22);
      border-radius: 999px;
      background: rgba(163, 255, 95, 0.08);
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 800;
    }

    .games {
      display: grid;
      gap: 10px;
    }

    .game {
      display: grid;
      grid-template-columns: 66px 1fr;
      align-items: center;
      gap: 18px;
      min-width: 0;
      padding: 15px 18px;
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.035);
    }

    .game-label {
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .numbers {
      display: flex;
      justify-content: space-between;
      gap: clamp(7px, 1.5vw, 14px);
      min-width: 0;
    }

    .ball {
      display: grid;
      flex: 0 1 52px;
      aspect-ratio: 1;
      place-items: center;
      min-width: 38px;
      max-width: 52px;
      border-radius: 50%;
      color: #fff;
      font-size: clamp(0.9rem, 2.4vw, 1.06rem);
      font-weight: 900;
      line-height: 1;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.42);
      box-shadow: inset 0 2px 3px rgba(255,255,255,.34), 0 7px 14px rgba(0,0,0,.28);
      animation: ball-in 420ms cubic-bezier(.2,.8,.2,1) both;
    }

    .yellow { background: linear-gradient(145deg, #ffd95a, #e9a800); color: #3b2d00; text-shadow: none; }
    .blue   { background: linear-gradient(145deg, #55b9ff, #2375d8); }
    .red    { background: linear-gradient(145deg, #ff7777, #dc3545); }
    .gray   { background: linear-gradient(145deg, #aeb7c5, #687386); }
    .green  { background: linear-gradient(145deg, #66d995, #249b5c); }

    .actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-top: 22px;
    }

    .notice {
      margin: 0;
      color: #8995a9;
      font-size: 0.8rem;
    }

    button {
      flex: none;
      min-height: 50px;
      padding: 0 24px;
      border: 0;
      border-radius: 15px;
      background: var(--accent);
      color: #14200c;
      font: inherit;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(128, 230, 59, 0.2);
      transition: transform 160ms ease, background-color 160ms ease, box-shadow 160ms ease;
    }

    button:hover {
      transform: translateY(-2px);
      background: var(--accent-strong);
      box-shadow: 0 14px 30px rgba(128, 230, 59, 0.3);
    }

    button:active { transform: translateY(0); }
    button:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }

    @keyframes ball-in {
      from { opacity: 0; transform: translateY(8px) scale(0.82); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (max-width: 620px) {
      main { width: min(100% - 22px, 880px); padding-block: 30px; }
      .panel { border-radius: 22px; }
      .game { grid-template-columns: 1fr; gap: 9px; padding: 14px 12px; }
      .numbers { gap: 6px; }
      .ball { min-width: 0; width: 100%; }
      .actions { align-items: stretch; flex-direction: column-reverse; }
      button { width: 100%; }
      .notice { text-align: center; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <section class="app" aria-labelledby="page-title">
      <p class="eyebrow">Lucky number generator</p>
      <h1 id="page-title">오늘의 행운을<br>가볍게 뽑아보세요.</h1>
      <p class="intro">1부터 45까지, 겹치지 않는 여섯 개의 번호를 다섯 게임씩 추천해 드려요.</p>

      <div class="panel">
        <div class="panel-head">
          <h2 class="panel-title">추천 번호</h2>
          <span class="count">5 GAMES</span>
        </div>

        <div class="games" id="games" aria-live="polite" aria-label="로또 추천 번호"></div>

        <div class="actions">
          <p class="notice">모든 조합의 당첨 확률은 동일하며 재미용 추천입니다.</p>
          <button id="regenerate" type="button">다시 추천</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    const gamesElement = document.getElementById('games');
    const regenerateButton = document.getElementById('regenerate');

    function secureRandom(max) {
      if (window.crypto && window.crypto.getRandomValues) {
        const limit = Math.floor(0x100000000 / max) * max;
        const value = new Uint32Array(1);
        do window.crypto.getRandomValues(value); while (value[0] >= limit);
        return value[0] % max;
      }
      return Math.floor(Math.random() * max);
    }

    function drawNumbers() {
      const pool = Array.from({ length: 45 }, (_, index) => index + 1);
      for (let i = pool.length - 1; i > 0; i--) {
        const j = secureRandom(i + 1);
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }
      return pool.slice(0, 6).sort((a, b) => a - b);
    }

    function colorClass(number) {
      if (number <= 10) return 'yellow';
      if (number <= 20) return 'blue';
      if (number <= 30) return 'red';
      if (number <= 40) return 'gray';
      return 'green';
    }

    function renderGames() {
      const fragment = document.createDocumentFragment();

      for (let gameIndex = 1; gameIndex <= 5; gameIndex++) {
        const row = document.createElement('div');
        row.className = 'game';

        const label = document.createElement('span');
        label.className = 'game-label';
        label.textContent = `GAME ${String(gameIndex).padStart(2, '0')}`;

        const numbers = document.createElement('div');
        numbers.className = 'numbers';

        drawNumbers().forEach((number, numberIndex) => {
          const ball = document.createElement('span');
          ball.className = `ball ${colorClass(number)}`;
          ball.style.animationDelay = `${gameIndex * 35 + numberIndex * 28}ms`;
          ball.textContent = number;
          numbers.appendChild(ball);
        });

        row.append(label, numbers);
        fragment.appendChild(row);
      }

      gamesElement.replaceChildren(fragment);
    }

    regenerateButton.addEventListener('click', renderGames);
    renderGames();
  </script>
</body>
</html>
